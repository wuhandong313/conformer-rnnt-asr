# User approved stride1 placement experiment on 2026-10-22.
# Fresh training; batch budget must pass the recorded real-batch launch gate.
paths:
  dataset_path: /test21/librispeech
  global_stats_path: /test21/librispeech/global_stats.json
  exp_dir: /test21/conformer-rnnt-asr/exp_phone69_460h_offline_native_placement_layer5_stride1_s42_e50
  from_checkpoint: null
tokenizer:
  type: phone69
  vocab_path: configs/phone69_vocab.json
model:
  sequence_mode: offline
  input_dim: 80
  encoding_dim: 256
  num_symbols: 69
  time_reduction_input_dim: 128
  time_reduction_stride: 1
  num_heads: 8
  ffn_dim: 512
  depthwise_conv_kernel_size: 31
  dropout: 0.1
  compression:
    stages:
    - after_layer: 5
      detector:
        type: cosine_diff
      mixer:
        type: learned
      window_size: 5
      weight_predictor_mode: five_frames
  predictor:
    symbol_embedding_dim: 128
    num_lstm_layers: 2
    lstm_hidden_dim: 128
    lstm_layer_norm: true
    lstm_layer_norm_epsilon: 0.001
    lstm_dropout: 0.3
  joiner:
    activation: relu
  num_layers: 10
training:
  learning_rate: 0.0005
  adam_betas:
  - 0.9
  - 0.999
  adam_eps: 1.0e-08
  warmup_steps: 10000
  rnnt_loss_reduction: sum
  rnnt_loss_clamp: 1.0
  rnnt_loss_chunk: batch
  gradient_clip_val: 10.0
  epochs: 50
data:
  sample_rate: 16000
  n_fft: 400
  n_mels: 80
  hop_length: 160
  spec_augment:
    freq_mask_param: 27
    time_mask_param: 100
    time_mask_prob: 0.2
  transcript_suffix: -ph
  strip_spaces: false
  max_token_limit: 5000
  rnnt_numel_limit: 1900000000
  rnnt_frames_per_char: 3.5
  num_workers: 20
  prefetch_factor: 2
  train_subset:
  - train-clean-100
  - train-clean-360
  val_subset: dev-clean
  test_subset: test-clean
trainer:
  accelerator: cuda
  strategy: auto
  devices: 1
  num_nodes: 1
  log_every_n_steps: 10
  val_check_interval: 200
  num_sanity_val_steps: 0
  fast_dev_run: false
  matmul_precision: high
  accumulate_grad_batches: 1
  checkpoint:
    save_top_k: 2
    save_weights_only: true
    save_last: true
    save_on_validation_end: true
    val_checkpoint_interval: 200
    train_checkpoint_interval: 500
decoding:
  beam_width: 20
debug: false
seed: 42
