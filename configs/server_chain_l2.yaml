# ===========================================================================
# iter-9 消融: lookahead 1 → 2 — 覆盖率杠杆 (chunk 对齐零延迟预算)
# ===========================================================================
# 假设 (experiment-log iter-9「流式预算口径修正」+「杠杆估算」):
# 命中率分解 hit% ≈ 覆盖率 × ~100% + (1 − 覆盖率) × 43%, 覆盖率由窗内可见
# 未来帧数决定 (h1 85.7% / h2 45.0% @look=1)。look=8 实测预测区 95.94%,
# chunk 对齐下帧 t 的零延迟未来预算 = 3 − (t mod 4) ∈ {3,2,1,0} (均值 1.5
# 帧), 故 look=2 只在预算 <2 的帧付跨 chunk 延迟 (≈16 mel ≈ 160ms), 是
# 「提覆盖率」杠杆的最小步长。估算 h2 总命中 59.38 → ≈78%。
#
# 单一变量: 只把 lookahead_frames 1 → 2 (窗 [t-7..t+2], 宽 10), 其余与
# iter-8h2 (configs/server_chain.yaml) 完全一致。对照数字 (配置 B, 100
# 样本, ckpt=ep07-st20400): h1 hit 90.60 / h2 59.38; found% 85.72 / 45.02;
# predHit 43.01 / 42.85 (见 experiment-log iter-9)。
#
# warm-start: iter-8h2 ep07 (与 p15 消融同一 ckpt)。context_acoustic 形状
# 随窗宽改变 (9*512 → 10*512), 加载时按 shape-mismatch 自动丢弃 → 声学投影
# 冷启动 (预期瞬态, 其余权重照常载入)。
# iter-9: sim 通道 (chain_sim/sim_bias/delay/蒸馏) 已整体移除, 历史对照里
# 的 found% / copied% 口径随之退役 — 观测改为总 hit% 与显示延迟。
#
# 观测: monitor 接受率 (与历史同口径) + 平台后跑 eval_display 看总 hit%
# 相对 90.60/59.38 的变化; 重点关注
# 跨 chunk 帧的实际延迟 (按 ms 校核, 见日志「流式预算口径修正」)。
# 与 p15 消融 (configs/server_chain_p15.yaml) 互为独立单变量;
# 两者若各自有效, 再合并为 [t-15..t+2]。
#
# 用法: python train.py configs/server_chain_l2.yaml
# ===========================================================================

paths:
  dataset_path: "/test21/medusa"
  sp_model_path: "/test21/medusa/spm_bpe_74.model"
  global_stats_path: "/test21/medusa/global_stats.json"
  exp_dir: "/test21/conformer-rnnt-asr/exp_iter2"
  from_checkpoint: "/test21/conformer-rnnt-asr/exp_iter2/checkpoints/val-naive-h2-frz-sl1-post-chain-p7-sim-dl-epoch=07-step=20400.ckpt"

model:
  input_dim: 80
  encoding_dim: 512
  num_symbols: 74

  time_reduction_input_dim: 128
  time_reduction_stride: 4
  right_context_length: 4

  num_heads: 8
  ffn_dim: 1024
  num_layers_block1: 2
  num_layers_block2: 8
  depthwise_conv_kernel_size: 31
  dropout: 0.1

  compression:
    # 必须与 base checkpoint (val-none-epoch=34-step=21600, 实际 naive 训练) 一致
    filter: "naive"
    hanning_window_size: 5
    weight_predictor_mode: "diff5"

  predictor:
    symbol_embedding_dim: 128
    num_lstm_layers: 2
    lstm_hidden_dim: 128
    lstm_layer_norm: true
    lstm_layer_norm_epsilon: 0.001
    lstm_dropout: 0.3

  medusa:
    # 固定 2 头 (h1/h2)
    num_heads: 2
    input_mode: "stream_local"
    # iter-9 消融: 未来窗 1 → 2 (唯一的变量), 过去窗保持 7
    lookahead_frames: 2
    past_frames: 7
    draft_after_emit: true
    chain_states: true

    # 冻结 base (encoder + predictor + joiner), 只训 Medusa heads
    freeze_base: true

    ce_loss_weights: [0.8, 0.64]
    kl_weight: 0.0

  joiner:
    activation: "relu"

training:
  learning_rate: 0.0005
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  warmup_steps: 1000
  rnnt_loss_reduction: "mean"
  rnnt_loss_clamp: 1.0
  gradient_clip_val: 10.0
  epochs: 20

data:
  sample_rate: 16000
  n_fft: 400
  n_mels: 80
  hop_length: 160

  spec_augment:
    freq_mask_param: 27
    time_mask_param: 100
    time_mask_prob: 0.2

  max_token_limit: 4000
  num_workers: 20
  prefetch_factor: 2

  train_subset: "train-clean-100"
  val_subset: "dev-clean"
  test_subset: "test-clean"

trainer:
  accelerator: "cuda"
  strategy: "auto"
  devices: 1
  num_nodes: 1
  log_every_n_steps: 10
  val_check_interval: 200
  num_sanity_val_steps: 0
  fast_dev_run: false
  matmul_precision: "high"
  accumulate_grad_batches: 1

  checkpoint:
    save_top_k: 2
    save_weights_only: true
    val_checkpoint_interval: 200
    train_checkpoint_interval: 100

decoding:
  beam_width: 0
  mode: "spec_greedy"
  spec:
    max_draft: 2
    per_token_blank: 4

debug: false
seed: 42
