# ===========================================================================
# Conformer-RNNT ASR — 服务器训练配置
# ===========================================================================
#
# 用法:
#   python train.py configs/server.yaml
#
# 所有参数集中在此，修改参数 → 编辑此文件即可，无需改代码。
#
# ===========================================================================

# ---------------------------------------------------------------------------
# 路径配置 — 数据集、模型文件、输出目录
# ---------------------------------------------------------------------------
paths:
  # LibriSpeech 数据集根目录 (内含 LibriSpeech/ 子目录)
  dataset_path: "/test21/librispeech"

  # SentencePiece BPE 模型文件路径 (文本 tokenize / detokenize)
  sp_model_path: "/test21/librispeech/spm_bpe_74.model"

  # 全局特征统计文件路径 (JSON: mean + invstddev)
  global_stats_path: "/test21/librispeech/global_stats.json"

  # 实验输出目录 (checkpoints、logs 保存位置)
  exp_dir: "/test21/conformer-rnnt-asr/exp"

  # 从某个 checkpoint 恢复训练 (null = 从头训练, 或填 .ckpt 路径)
  from_checkpoint: null

# ---------------------------------------------------------------------------
# 模型架构参数
# ---------------------------------------------------------------------------
model:
  # === 输入 / 输出 ===
  # Mel 滤波器组维度 (梅尔频谱的频域维度)
  input_dim: 80

  # 编码器输出维度 (传给 Joiner 的向量维度)
  encoding_dim: 512

  # SentencePiece 词表大小 (不含 blank, blank 会自动 +1)
  num_symbols: 74

  # === 时间降采样 ===
  # 输入线性投影后的维度
  time_reduction_input_dim: 128

  # 帧合并因子 (4 表示每 4 帧合并为 1 帧, 帧率从 200fps → 50fps)
  time_reduction_stride: 4

  # 每条语音末尾追加的右上下文帧数 (用于流式推理的 lookahead)
  right_context_length: 4

  # === Conformer 编码器 ===
  # 每层多头注意力的头数
  num_heads: 8

  # Feed-forward 隐藏层维度
  ffn_dim: 1024

  # 压缩前的 Conformer 层数 (Block 1 — 捕捉局部特征)
  num_layers_block1: 2

  # 压缩后的 Conformer 层数 (Block 2 — 建模长程依赖)
  num_layers_block2: 8

  # Depthwise 卷积核大小 (Conformer 的核心组件, 控制局部上下文窗口)
  depthwise_conv_kernel_size: 31

  # Dropout 概率 (应用于 Conformer 各子层)
  dropout: 0.1

  # === 层间动态压缩 ===
  compression:
    # 压缩滤波模式:
    #   none            — 不压缩 (直通, 序列长度不变)
    #   naive           — 原始帧间差 → find_peaks 选关键帧
    #   hanning         — 原始帧间差 → find_peaks → 可学习 Hanning 窗加权平滑
    #   fir             — FIR 低通滤波 → 粗定位 → 在原信号上精确定位
    #   savgol          — Savitzky-Golay 平滑 → find_peaks
    #   savgol_hanning  — Savitzky-Golay 平滑 + Hanning 加权
    filter: "hanning"

    # Hanning 窗大小 (仅 hanning / savgol_hanning 模式生效)
    # 控制每个峰/谷周围做加权平滑的帧数
    hanning_window_size: 5

    # 权重预测器输入模式 (仅 hanning / savgol_hanning 模式生效):
    #   single_frame — 仅取峰/谷位置单帧特征 → MLP → 窗权重
    #   diff5        — 取峰/谷周围 5 个 diff 值的 4 个差值 → MLP → 窗权重
    #   five_frames  — 取峰/谷 ±2 共 5 帧拼接 (5*F 维) → MLP → 窗权重
    weight_predictor_mode: "diff5"

  # === Predictor (RNN-T 语言模型组件) ===
  predictor:
    # Token embedding 维度
    symbol_embedding_dim: 128

    # LSTM 层数
    num_lstm_layers: 2

    # LSTM 隐藏状态维度 (通常与 symbol_embedding_dim 相同)
    lstm_hidden_dim: 128

    # 是否对 LSTM 的 gate / cell 做 LayerNorm
    lstm_layer_norm: true

    # LSTM LayerNorm 的 epsilon
    lstm_layer_norm_epsilon: 0.001

    # LSTM 层间 Dropout 概率
    lstm_dropout: 0.3

  # === Joiner (联合网络, 融合声学+语言编码) ===
  joiner:
    # 非线性激活函数: relu | tanh | gelu | silu
    activation: "relu"

# ---------------------------------------------------------------------------
# 训练超参数
# ---------------------------------------------------------------------------
training:
  # === 优化器 (Adam) ===
  # 峰值学习率 (预热结束后达到此值)
  learning_rate: 0.0005

  # Adam beta 系数 (momentum 衰减率)
  adam_betas: [0.9, 0.999]

  # Adam epsilon (数值稳定性)
  adam_eps: 1.0e-8

  # === 学习率调度 ===
  # 线性预热步数 (前 N 步从 0 线性增长到 learning_rate)
  warmup_steps: 10000

  # === RNN-T 损失 ===
  # Loss 归约方式: "mean" | "sum" | "none"
  rnnt_loss_reduction: "mean"

  # Logit 截断值 (防止 log-softmax 数值溢出)
  rnnt_loss_clamp: 1.0

  # === 梯度裁剪 ===
  # 梯度 L2 范数裁剪阈值
  gradient_clip_val: 10.0

  # === 训练轮数 ===
  epochs: 120

# ---------------------------------------------------------------------------
# 数据配置
# ---------------------------------------------------------------------------
data:
  # 音频采样率 (Hz)
  sample_rate: 16000

  # === Mel 频谱参数 ===
  # FFT 点数
  n_fft: 400

  # Mel 滤波器组数量
  n_mels: 80

  # 帧移 (hop length), 单位采样点. 16000/160 = 100fps
  hop_length: 160

  # === SpecAugment (仅训练时生效, 在线数据增强) ===
  spec_augment:
    # 频域掩码最大宽度 (掩掉多少 mel 频带)
    freq_mask_param: 27

    # 时域掩码最大宽度 (掩掉多少帧)
    time_mask_param: 100

    # 时域掩码应用概率 (每个 mask 独立的伯努利概率)
    time_mask_prob: 0.2

  # === 批处理 ===
  # 每 batch 最大 token 数 (按 target token 数累积分组, 控制显存)
  max_token_limit: 16000

  # DataLoader 子进程数 (A100 建议 16-24, 消除数据加载瓶颈)
  num_workers: 20

  # DataLoader 预取因子 (每个 worker 预加载 batch 数)
  prefetch_factor: 2

  # === 数据子集 ===
  # 训练集 (LibriSpeech 子集名)
  train_subset: "train-clean-100"

  # 验证集 (LibriSpeech 子集名)
  val_subset: "dev-clean"

  # 测试集 (LibriSpeech 子集名)
  test_subset: "test-clean"

# ---------------------------------------------------------------------------
# PyTorch Lightning Trainer 配置
# ---------------------------------------------------------------------------
trainer:
  # 加速器: "cuda" | "cpu" | "mps" | "tpu"
  accelerator: "cuda"

  # 分布式策略: "auto" | "ddp" | "ddp_spawn" | "deepspeed" | "fsdp"
  strategy: "auto"

  # GPU 数量 (单机多卡填 >1)
  devices: 1

  # 节点数 (多机训练填 >1)
  num_nodes: 1

  # === 日志与验证 ===
  # 每隔多少步打印一条日志
  log_every_n_steps: 10

  # 每隔多少训练步跑一次验证 (必须 ≤ 总 batch 数, 否则报错)
  val_check_interval: 200

  # 训练开始前的 sanity check 批次数 (0 = 跳过)
  num_sanity_val_steps: 0

  # 是否开启 fast_dev_run (调试用, 只跑 1 batch)
  fast_dev_run: false

  # Float32 矩阵乘法精度 (A100 Tensor Core): "high" = TF32, "medium" = bf16 TF32
  matmul_precision: "high"

  # 梯度累积步数 (模拟更大 batch, 不增显存. 1=不累积)
  accumulate_grad_batches: 1

  # === Checkpoint 保存 ===
  checkpoint:
    # 保留 top-k 个最优 checkpoint (按监控指标排序)
    save_top_k: 2

    # 是否只保存模型权重 (true=更小文件, false=含优化器状态可恢复训练)
    save_weights_only: true

    # 验证 checkpoint 保存间隔 (每 N 个训练步保存一次)
    val_checkpoint_interval: 100

    # 训练 checkpoint 保存间隔 (每 N 个训练步保存一次)
    train_checkpoint_interval: 100

# ---------------------------------------------------------------------------
# 解码配置 (eval 时生效)
# ---------------------------------------------------------------------------
decoding:
  # beam_width: beam 宽度
  #   0  → greedy 推理 (RNNTBeamSearch width=1)，逐 token 贪心
  #        作为未来投机解码 (speculative decoding) 的无损 oracle 基线
  #   >0 → 标准 beam search (原仓库默认 20)
  beam_width: 0

# ---------------------------------------------------------------------------
# 其他
# ---------------------------------------------------------------------------
# 是否开启 debug 日志 (true 会打印时间戳)
debug: false

# 全局随机种子 (保证可复现性)
seed: 42
