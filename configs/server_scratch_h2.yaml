# ===========================================================================
# Conformer-RNNT ASR — 服务器配置: Medusa 2 头, 从头训练 (共享 w_vocab 架构)
# ===========================================================================
#
# 用法:
#   python train.py configs/server_scratch_h2.yaml
#
# 相对 server_scratch.yaml 的差异 (仅一个变量: 头数):
#   - medusa.num_heads: 1 → 2                       (head1 预测 y_{u+1}, head2 预测 y_{u+2})
#   - paths.exp_dir: exp_scratch → exp_scratch_h2    (独立目录, 避免 checkpoint 混合)
#
# 其余与 server_scratch.yaml 完全一致 (naive 压缩, from_checkpoint=null,
# freeze_base=false, hop_length 160, beam_width 0, A100 调参)。
#
# 对照目的: 与 server_scratch.yaml (head=1) 在相同的"从头 + 不冻结 + 掩码 loss +
# 共享 w_vocab"条件下隔离"头数"变量的影响。若 head=2 接受率明显更好 → 继续加头;
# 若两者接近 → 头数不是瓶颈, 该转向对齐问题 (单调 mask / FAL)。
#
# ===========================================================================

# ---------------------------------------------------------------------------
# 路径配置 — 数据集、模型文件、输出目录
# ---------------------------------------------------------------------------
paths:
  # LibriSpeech 数据集根目录 (内含 LibriSpeech/ 子目录)
  dataset_path: "/test21/medusa"

  # SentencePiece BPE 模型文件路径 (文本 tokenize / detokenize)
  sp_model_path: "/test21/medusa/spm_bpe_74.model"

  # 全局特征统计文件路径 (JSON: mean + invstddev)
  global_stats_path: "/test21/medusa/global_stats.json"

  # 实验输出目录 (独立于 server_scratch, 避免 checkpoint 混合)
  exp_dir: "/test21/conformer-rnnt-asr/exp_scratch_h2"

  # 从头训练 (null = 不加载任何 checkpoint)
  from_checkpoint: null

# ---------------------------------------------------------------------------
# 模型架构参数
# ---------------------------------------------------------------------------
model:
  # === 输入 / 输出 ===
  input_dim: 80
  encoding_dim: 512
  num_symbols: 74

  # === 时间降采样 ===
  time_reduction_input_dim: 128
  time_reduction_stride: 4
  right_context_length: 4

  # === Conformer 编码器 ===
  num_heads: 8
  ffn_dim: 1024
  num_layers_block1: 2
  num_layers_block2: 8
  depthwise_conv_kernel_size: 31
  dropout: 0.1

  # === 层间动态压缩 ===
  compression:
    # 与 server_scratch.yaml 保持一致 (naive): 只动 Medusa 头数
    filter: "naive"
    hanning_window_size: 5
    weight_predictor_mode: "diff5"

  # === Predictor (RNN-T 语言模型组件) ===
  predictor:
    symbol_embedding_dim: 128
    num_lstm_layers: 2
    lstm_hidden_dim: 128
    lstm_layer_norm: true
    lstm_layer_norm_epsilon: 0.001
    lstm_dropout: 0.3

  # === Medusa 多头未来标签预测 (2 头 + 不冻结, 从头联合训练) ===
  medusa:
    # 头数 K (head 1..K 做 aux CE); 这里 2 = head1 预测 y_{u+1}, head2 预测 y_{u+2}
    num_heads: 2
    input_mode: "stream_local"
    lookahead_frames: 1

    # base model (encoder/predictor/joiner) 与 Medusa heads 联合从头训练
    freeze_base: false

    # 各 head 的 shifted-CE 权重 λ_k=0.8^k (num_heads=2 时取前 2 个)
    ce_loss_weights: [0.8, 0.64, 0.512, 0.4096]

    # KL-to-base 权重 β (防 draft 漂移)
    kl_weight: 0.05

  # === Joiner (联合网络, 融合声学+语言编码) ===
  joiner:
    activation: "relu"

# ---------------------------------------------------------------------------
# 训练超参数
# ---------------------------------------------------------------------------
training:
  learning_rate: 0.0005
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  warmup_steps: 10000
  rnnt_loss_reduction: "mean"
  rnnt_loss_clamp: 1.0
  gradient_clip_val: 10.0
  epochs: 120

# ---------------------------------------------------------------------------
# 数据配置
# ---------------------------------------------------------------------------
data:
  sample_rate: 16000
  n_fft: 400
  n_mels: 80
  hop_length: 160

  spec_augment:
    freq_mask_param: 27
    time_mask_param: 100
    time_mask_prob: 0.2

  max_token_limit: 4000
  num_workers: 20
  prefetch_factor: 2

  train_subset: "train-clean-100"
  val_subset: "dev-clean"
  test_subset: "test-clean"

# ---------------------------------------------------------------------------
# PyTorch Lightning Trainer 配置
# ---------------------------------------------------------------------------
trainer:
  accelerator: "cuda"
  strategy: "auto"
  devices: 1
  num_nodes: 1

  log_every_n_steps: 10
  val_check_interval: 200
  num_sanity_val_steps: 0
  fast_dev_run: false
  matmul_precision: "high"
  accumulate_grad_batches: 1

  checkpoint:
    save_top_k: 2
    save_weights_only: true
    val_checkpoint_interval: 200
    train_checkpoint_interval: 100

# ---------------------------------------------------------------------------
# 解码配置 (eval 时生效)
# ---------------------------------------------------------------------------
decoding:
  # width-1 greedy = 无损投机解码的 oracle 基线
  beam_width: 0

  # spec_greedy: 真投机解码 (greedy oracle 等价) + Medusa draft 接受率统计
  mode: "spec_greedy"

  spec:
    max_draft: 4
    per_token_blank: 4

# ---------------------------------------------------------------------------
# 其他
# ---------------------------------------------------------------------------
debug: false
seed: 42
