# ===========================================================================
# iter-9: 投机显示 (speculative display) — 纯显示价值模型 + 流式合法头重训
# ===========================================================================
# 价值模型转向: Medusa 草稿只上屏 (用完即弃), 解码回归纯贪心 RNNT。
# 真实 token 到达时确认或替换上屏猜测; 猜错代价 = 屏幕闪烁, 无正确性风险。
# 明示放弃真实提速 (RTF 不变); iter-1..8 的验证器/接受率机制代码保留但闲置。
#
# 新的一级指标 = 提前量 × 命中率 (− 替换率), 由 scripts/eval_display.py 度量。
#
# 阶段 1 (基线, 零训练): 只换价值模型, 不改架构 — 窗保持 iter-7/8 的
# [t-7..t+1] (past=7, lookahead=1, 宽 9)。关键事实: 过去帧在流式部署时
# 已提交 → past=7 同样流式合法 (spec_decode.py:161 取已算好的 enc), 所以
# 缩窗换不来合法性, 只会丢上下文并让 context_acoustic 冷启动。
# 收缩与否待基线数据决定 (见 docs/experiment-log.md iter-9)。
# context_acoustic 形状与 BEST_iter7 一致 (9*512) → 权重原样加载, 无冷启动。
# chain_sim / delay_decompose / sim_bias 全部关闭 (验证器模拟特征, 显示模型
# 下无意义; 模块不创建, 与 iter-7 ckpt 键集合完全兼容)。
# 训练目标 = shifted_ce (head-k 在 post-emit 列 m 预测 y_{m+k-1}), 即
# 「草稿 head-j 预测第 u+1+j 个 token」— 与显示任务逐位对齐。
# accept_ce / delay_ce 置 0: 二者依赖 chain_sim 的扫描标签, 本配置下恒 0。
# 链条件 (draft embedding + rolled states) 保留 (显示序列连贯性)。
#
# warm-start: BEST_iter7.ckpt (2 头加载自动丢 medusa_heads.2.*)。
#
# 用法:
#   python scripts/eval_display.py configs/server_display.yaml 100 \
#       /test21/conformer-rnnt-asr/exp_iter2/BEST_iter7.ckpt
#   python train.py configs/server_display.yaml
# ===========================================================================

paths:
  dataset_path: "/test21/medusa"
  sp_model_path: "/test21/medusa/spm_bpe_74.model"
  global_stats_path: "/test21/medusa/global_stats.json"
  exp_dir: "/test21/conformer-rnnt-asr/exp_iter2"
  from_checkpoint: "/test21/conformer-rnnt-asr/exp_iter2/BEST_iter7.ckpt"

model:
  input_dim: 80
  encoding_dim: 512
  num_symbols: 74

  time_reduction_input_dim: 128
  time_reduction_stride: 4
  right_context_length: 4

  num_heads: 8
  ffn_dim: 1024
  num_layers_block1: 2
  num_layers_block2: 8
  depthwise_conv_kernel_size: 31
  dropout: 0.1

  compression:
    # 必须与 base checkpoint (val-none-epoch=34-step=21600, 实际 naive 训练) 一致
    filter: "naive"
    hanning_window_size: 5
    weight_predictor_mode: "diff5"

  predictor:
    symbol_embedding_dim: 128
    num_lstm_layers: 2
    lstm_hidden_dim: 128
    lstm_layer_norm: true
    lstm_layer_norm_epsilon: 0.001
    lstm_dropout: 0.3

  medusa:
    # 固定 2 头 (h1/h2); ckpt 中 medusa_heads.2.* 加载时自动丢弃
    num_heads: 2
    input_mode: "stream_local"
    # iter-9 阶段 1: 窗与 BEST_iter7 同形 [t-7..t+1] (宽 9), 权重原样加载。
    # lookahead=1 是流式硬约束 (right_ctx(4)//stride(4)=1); past 帧免费。
    lookahead_frames: 1
    past_frames: 7
    draft_after_emit: true
    chain_states: true
    # iter-9: 验证器模拟特征全关 (纯显示价值模型下无验证器)
    chain_sim: false
    delay_decompose: false
    # 二者的标签来自 chain_sim 扫描, 关闭后恒 0 — 显式置 0 避免误读日志
    accept_ce_weight: 0.0
    delay_ce_weight: 0.0
    # tag 附加后缀: 区分历史同参数 ckpt 文件名 (避免 monitor 缓存串档)
    tag_suffix: "disp"

    # 冻结 base (encoder + predictor + joiner), 只训 Medusa heads
    freeze_base: true

    ce_loss_weights: [0.8, 0.64]
    # iter-1 实验筛选出 KL=0 是最优; chain 对齐下 KL 与 CE 目标冲突
    kl_weight: 0.0

  joiner:
    activation: "relu"

training:
  learning_rate: 0.0005
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  warmup_steps: 1000
  rnnt_loss_reduction: "mean"
  rnnt_loss_clamp: 1.0
  gradient_clip_val: 10.0
  epochs: 20

data:
  sample_rate: 16000
  n_fft: 400
  n_mels: 80
  hop_length: 160

  spec_augment:
    freq_mask_param: 27
    time_mask_param: 100
    time_mask_prob: 0.2

  max_token_limit: 4000
  num_workers: 20
  prefetch_factor: 2

  train_subset: "train-clean-100"
  val_subset: "dev-clean"
  test_subset: "test-clean"

trainer:
  accelerator: "cuda"
  strategy: "auto"
  devices: 1
  num_nodes: 1
  log_every_n_steps: 10
  val_check_interval: 200
  num_sanity_val_steps: 0
  fast_dev_run: false
  matmul_precision: "high"
  accumulate_grad_batches: 1

  checkpoint:
    save_top_k: 2
    save_weights_only: true
    val_checkpoint_interval: 200
    train_checkpoint_interval: 100

decoding:
  # spec_greedy 保留用于 monitor 接受率观测 (与历史口径可比);
  # 产品形态的显示评估走 scripts/eval_display.py (贪心 + 头草稿时间线)
  beam_width: 0
  mode: "spec_greedy"
  spec:
    max_draft: 2
    per_token_blank: 4

debug: false
seed: 42
