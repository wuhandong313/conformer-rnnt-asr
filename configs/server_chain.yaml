# ===========================================================================
# iter-8: 时延分解预测 (1 帧 lookahead 流式预算) — 服务器训练配置
# ===========================================================================
# 基于 multihead 分支 (iter-7 最好成绩 h1=0.920/h2=0.688/h3=0.346,
# overall=0.651, PER=0.073)。iter-6/7 证实容量翻倍无效 (h2/h3 平台),
# iter-8 转向信息注入, 严格满足 streaming 分支的 1 帧未来预算
# (streaming.yaml: right_context_frames=4 mel = 1 encoder 帧):
#   1. lookahead_frames: 1 + past_frames: 7 — 声学窗重排为
#      [t-7..t-1, t, t+1], 用已提交过去帧替换非法未来帧 (结构宽度
#      不变, context_acoustic 权重完整 warm-start)。
#   2. chain_sim: true — 验证器模拟扫描特征: head-k 读取真 joiner 在
#      [t, t+1] 窗口对其 rolled state 的逐步 argmax (零初始化投影)。
#   3. delay_decompose: true — 每头时延分类器蒸馏验证器 blank-walk
#      时延, 期望 embedding 调制 token 路径; accept_ce 升级为验证器
#      软目标蒸馏 (完整 softmax, 网格全知)。
#
# 用法: python train.py configs/server_chain.yaml
# ===========================================================================

paths:
  dataset_path: "/test21/medusa"
  sp_model_path: "/test21/medusa/spm_bpe_74.model"
  global_stats_path: "/test21/medusa/global_stats.json"
  exp_dir: "/test21/conformer-rnnt-asr/exp_iter2"
  from_checkpoint: "/test21/conformer-rnnt-asr/exp_iter2/checkpoints/val-naive-h3-frz-sl1-post-chain-p7-sim-dl-epoch=01-step=5200-v1.ckpt"

model:
  input_dim: 80
  encoding_dim: 512
  num_symbols: 74

  time_reduction_input_dim: 128
  time_reduction_stride: 4
  right_context_length: 4

  num_heads: 8
  ffn_dim: 1024
  num_layers_block1: 2
  num_layers_block2: 8
  depthwise_conv_kernel_size: 31
  dropout: 0.1

  compression:
    # 必须与 base checkpoint (val-none-epoch=34-step=21600, 实际 naive 训练) 一致
    filter: "naive"
    hanning_window_size: 5
    weight_predictor_mode: "diff5"

  predictor:
    symbol_embedding_dim: 128
    num_lstm_layers: 2
    lstm_hidden_dim: 128
    lstm_layer_norm: true
    lstm_layer_norm_epsilon: 0.001
    lstm_dropout: 0.3

  medusa:
    num_heads: 3
    input_mode: "stream_local"
    # iter-8: 1 帧流式未来预算 + 7 帧已提交过去 (结构宽度不变 = 9 帧)
    lookahead_frames: 1
    past_frames: 7
    draft_after_emit: true
    chain_states: true
    chain_sim: true
    delay_decompose: true
    # iter-8b: epoch0-2 平台在 overall~0.50 (sim 上限 0.92), 蒸馏压力不足
    # — accept_ce 1.0→3.0, delay_ce 0.5→1.0, 从 epoch=02 ckpt warm-start
    accept_ce_weight: 3.0
    delay_ce_weight: 1.0
    # iter-8b'': 直注偏置行范数增长 ~5e-4/步 (Adam 基础步长), 翻转需 3-5 —
    # 专用 10x lr 组加速 (只影响 draft 头)
    sim_bias_lr_mult: 10.0

    # 冻结 base (encoder + predictor + joiner), 只训 Medusa heads
    freeze_base: true

    ce_loss_weights: [0.8, 0.64, 0.512]
    # iter-1 实验筛选出 KL=0 是最优 (WINNER=stream_h2_kl0); 且 chain 对齐下
    # KL(base@l) 是 blank-dominant 分布, 与 CE 目标冲突, 必须为 0。
    kl_weight: 0.0

  joiner:
    activation: "relu"

training:
  learning_rate: 0.0005
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  warmup_steps: 1000
  rnnt_loss_reduction: "mean"
  rnnt_loss_clamp: 1.0
  gradient_clip_val: 10.0
  epochs: 20

data:
  sample_rate: 16000
  n_fft: 400
  n_mels: 80
  hop_length: 160

  spec_augment:
    freq_mask_param: 27
    time_mask_param: 100
    time_mask_prob: 0.2

  max_token_limit: 4000
  num_workers: 20
  prefetch_factor: 2

  train_subset: "train-clean-100"
  val_subset: "dev-clean"
  test_subset: "test-clean"

trainer:
  accelerator: "cuda"
  strategy: "auto"
  devices: 1
  num_nodes: 1
  log_every_n_steps: 10
  val_check_interval: 200
  num_sanity_val_steps: 0
  fast_dev_run: false
  matmul_precision: "high"
  accumulate_grad_batches: 1

  checkpoint:
    save_top_k: 2
    save_weights_only: true
    val_checkpoint_interval: 200
    train_checkpoint_interval: 100

decoding:
  beam_width: 0
  mode: "spec_greedy"
  spec:
    max_draft: 3
    per_token_blank: 4

debug: false
seed: 42
