# ===========================================================================
# Conformer-RNNT ASR — 服务器训练配置 (word-BPE 4000 标签协议)
# ===========================================================================
#
# 用法:
#   python train.py configs/server_lstm_word.yaml
#
# 标签协议切换: phoneme-74 → word-BPE-4000
#   - spm 模型: spm_bpe_4000_word.model (clean-100 + clean-360 官方词转写训练)
#   - transcript_suffix: ""  → 读官方 {spk}-{ch}.trans.txt (非 -ph 音素文件)
#   - strip_spaces: false    → 保留空格编码 (SPM ▁ 词片自带空格标记)
#   ⚠ 新旧协议数字不可直接比较 (token 序列与 blank_idx 均不同)
#
# ===========================================================================

# ---------------------------------------------------------------------------
# 路径配置 — 数据集、模型文件、输出目录
# ---------------------------------------------------------------------------
paths:
  # LibriSpeech 数据集根目录 (内含 LibriSpeech/ 子目录)
  dataset_path: "/test21/librispeech"

  # SentencePiece BPE 模型文件路径 (word-BPE 4000, 960h 全量版, 在 -main worktree 根目录)
  # 460h 备选: /test21/conformer-rnnt-asr-main/spm_bpe_4000_word.model
  sp_model_path: "/test21/conformer-rnnt-asr-main/spm_bpe_4000_word_960h.model"

  # 全局特征统计文件路径 (JSON: mean + invstddev)
  global_stats_path: "/test21/librispeech/global_stats.json"

  # 实验输出目录 (checkpoints、logs 保存位置)
  exp_dir: "/test21/conformer-rnnt-asr/exp_lstm_word"

  # 从某个 checkpoint 恢复训练 (null = 从头训练, 或填 .ckpt 路径)
  from_checkpoint: null

# ---------------------------------------------------------------------------
# 模型架构参数
# ---------------------------------------------------------------------------
model:
  # === 输入 / 输出 ===
  # Mel 滤波器组维度 (梅尔频谱的频域维度)
  input_dim: 80

  # 编码器输出维度 (传给 Joiner 的向量维度)
  encoding_dim: 512

  # SentencePiece 词表大小 (word-BPE 4000, blank 自动 = get_piece_size() = 4000)
  num_symbols: 4000

  # === 时间降采样 ===
  # 输入线性投影后的维度
  time_reduction_input_dim: 128

  # 帧合并因子 (4 表示每 4 帧合并为 1 帧, 帧率从 200fps → 50fps)
  time_reduction_stride: 4

  # 每条语音末尾追加的右上下文帧数 (用于流式推理的 lookahead)
  right_context_length: 4

  # === Conformer 编码器 ===
  # 每层多头注意力的头数
  num_heads: 8

  # Feed-forward 隐藏层维度
  ffn_dim: 1024

  # 压缩前的 Conformer 层数 (Block 1 — 捕捉局部特征)
  num_layers_block1: 2

  # 压缩后的 Conformer 层数 (Block 2 — 建模长程依赖)
  num_layers_block2: 8

  # Depthwise 卷积核大小 (Conformer 的核心组件, 控制局部上下文窗口)
  depthwise_conv_kernel_size: 31

  # Dropout 概率 (应用于 Conformer 各子层)
  dropout: 0.1

  # === 层间动态压缩 ===
  compression:
    # 压缩滤波模式: none | naive | hanning | fir | savgol | savgol_hanning
    filter: "naive"

    # Hanning 窗大小 (仅 hanning / savgol_hanning 模式生效)
    hanning_window_size: 5

    # 权重预测器输入模式 (仅 hanning / savgol_hanning 模式生效)
    weight_predictor_mode: "diff5"

  # === Predictor (RNN-T 语言模型组件) — LSTM, 与 emformer_rnnt_copy 同配置 ===
  predictor:
    # Token embedding 维度
    symbol_embedding_dim: 128

    # LSTM 层数
    num_lstm_layers: 2

    # LSTM 隐藏状态维度 (通常与 symbol_embedding_dim 相同)
    lstm_hidden_dim: 128

    # 是否对 LSTM 的 gate / cell 做 LayerNorm
    lstm_layer_norm: true

    # LSTM LayerNorm 的 epsilon
    lstm_layer_norm_epsilon: 0.001

    # LSTM 层间 Dropout 概率
    lstm_dropout: 0.3

  # === Joiner (联合网络, 融合声学+语言编码) ===
  joiner:
    # 非线性激活函数: relu | tanh | gelu | silu
    activation: "relu"

# ---------------------------------------------------------------------------
# 训练超参数
# ---------------------------------------------------------------------------
training:
  # === 优化器 (Adam) ===
  learning_rate: 0.0005

  adam_betas: [0.9, 0.999]

  adam_eps: 1.0e-8

  # === 学习率调度 ===
  warmup_steps: 10000

  # === RNN-T 损失 ===
  rnnt_loss_reduction: "sum"

  rnnt_loss_clamp: 1.0

  # === 梯度裁剪 ===
  gradient_clip_val: 10.0

  # === 训练轮数 ===
  epochs: 50

# ---------------------------------------------------------------------------
# 数据配置
# ---------------------------------------------------------------------------
data:
  # 音频采样率 (Hz)
  sample_rate: 16000

  # === Mel 频谱参数 ===
  n_fft: 400

  n_mels: 80

  hop_length: 160

  # === SpecAugment (仅训练时生效, 在线数据增强) ===
  spec_augment:
    freq_mask_param: 27

    time_mask_param: 100

    time_mask_prob: 0.2

  # === 转写协议 (word-BPE) ===
  # 每章转写文件名后缀: "" = 官方词转写 {spk}-{ch}.trans.txt ("-ph" = 音素, 旧协议)
  transcript_suffix: ""

  # 编码前是否去空格: word 协议必须 false (保留空格, SPM ▁ 词片依赖空格)
  strip_spaces: false

  # === 批处理 ===
  # 每 batch 最大字符数 (按转写字符长度累积分组). word 转写比音素串短,
  # 同预算下每 batch 句数更多, RNNT 目标序列 (BPE) 更短
  max_token_limit: 16000

  # DataLoader 子进程数 (A100 建议 16-24, 消除数据加载瓶颈)
  num_workers: 20

  # DataLoader 预取因子 (每个 worker 预加载 batch 数)
  prefetch_factor: 2

  # === 数据子集 ===
  # 960h 全量训练 (clean-100 + clean-360 + other-500 合并 loader, batch 不混子集)
  train_subset:
    - "train-clean-100"
    - "train-clean-360"
    - "train-other-500"

  # 验证集 (dev-clean + dev-other 合并, ~10.8h)
  val_subset:
    - "dev-clean"
    - "dev-other"

  # 测试集 (test-clean + test-other 合并, ~10.8h; eval CSV 按说话人 id 可拆 clean/other)
  test_subset:
    - "test-clean"
    - "test-other"

# ---------------------------------------------------------------------------
# PyTorch Lightning Trainer 配置
# ---------------------------------------------------------------------------
trainer:
  accelerator: "cuda"

  strategy: "auto"

  devices: 1

  num_nodes: 1

  log_every_n_steps: 10

  val_check_interval: 200

  num_sanity_val_steps: 0

  fast_dev_run: false

  # Float32 矩阵乘法精度 (A100 Tensor Core): "high" = TF32
  matmul_precision: "high"

  accumulate_grad_batches: 1

  # === Checkpoint 保存 ===
  checkpoint:
    save_top_k: 2

    save_weights_only: true

    val_checkpoint_interval: 100

    train_checkpoint_interval: 100

# ---------------------------------------------------------------------------
# 解码配置 (eval 时生效)
# ---------------------------------------------------------------------------
decoding:
  # 0 = greedy (投机解码无损 oracle); >0 = beam search
  beam_width: 20

# ---------------------------------------------------------------------------
# 其他
# ---------------------------------------------------------------------------
debug: false

seed: 42
