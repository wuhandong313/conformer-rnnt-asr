# ===========================================================================
# iter-9 显示评估 — 配置 B: iter-8h2 权重 (唯一按流式合法布局训过的)
# ===========================================================================
# 仅用于 scripts/eval_display.py, 不用于训练。
#
# iter-8h2 = 修复推理窗后的 2 头重训 (configs/server_chain.yaml): 窗
# [t-7..t+1] (past=7, lookahead=1 — 流式合法)。这是目前手上唯一「权重与
# 流式布局同构」的模型, 因此它是 iter-9 显示基线的正主。
#
# iter-9: sim 通道 (chain_sim/sim_bias/delay) 已从代码整体移除 — 加载
# iter-8h2 ckpt 时这些键按 unexpected-key 守卫自动丢弃, 无需任何开关。
#
# monitor 口径 (epoch=07/step=20400, 100 样本): h1=0.889 / h2=0.612 /
# overall=0.751 / PER=0.0733 / lossless_fail=0 (那是接受率; 本脚本量的是
# 显示命中率 + 提前量, 同一分布的不同切面)。
#
# 用法:
#   python scripts/eval_display.py configs/display_iter8h2.yaml 100
# ===========================================================================

paths:
  dataset_path: "/test21/medusa"
  sp_model_path: "/test21/medusa/spm_bpe_74.model"
  global_stats_path: "/test21/medusa/global_stats.json"
  exp_dir: "/test21/conformer-rnnt-asr/exp_iter2"
  from_checkpoint: "/test21/conformer-rnnt-asr/exp_iter2/checkpoints/val-naive-h2-frz-sl1-post-chain-p7-sim-dl-epoch=07-step=20400.ckpt"

model:
  input_dim: 80
  encoding_dim: 512
  num_symbols: 74

  time_reduction_input_dim: 128
  time_reduction_stride: 4
  right_context_length: 4

  num_heads: 8
  ffn_dim: 1024
  num_layers_block1: 2
  num_layers_block2: 8
  depthwise_conv_kernel_size: 31
  dropout: 0.1

  compression:
    filter: "naive"
    hanning_window_size: 5
    weight_predictor_mode: "diff5"

  predictor:
    symbol_embedding_dim: 128
    num_lstm_layers: 2
    lstm_hidden_dim: 128
    lstm_layer_norm: true
    lstm_layer_norm_epsilon: 0.001
    lstm_dropout: 0.3

  medusa:
    num_heads: 2
    input_mode: "stream_local"
    # iter-8h2 训练布局 (与权重同构): 7 帧已提交过去 + 当前 + 1 帧未来
    lookahead_frames: 1
    past_frames: 7
    draft_after_emit: true
    chain_states: true
    freeze_base: true
    ce_loss_weights: [0.8, 0.64]
    kl_weight: 0.0

  joiner:
    activation: "relu"

training:
  learning_rate: 0.0005
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  warmup_steps: 1000
  rnnt_loss_reduction: "mean"
  rnnt_loss_clamp: 1.0
  gradient_clip_val: 10.0
  epochs: 20

data:
  sample_rate: 16000
  n_fft: 400
  n_mels: 80
  hop_length: 160

  spec_augment:
    freq_mask_param: 27
    time_mask_param: 100
    time_mask_prob: 0.2

  max_token_limit: 4000
  num_workers: 20
  prefetch_factor: 2

  train_subset: "train-clean-100"
  val_subset: "dev-clean"
  test_subset: "test-clean"

trainer:
  accelerator: "cuda"
  strategy: "auto"
  devices: 1
  num_nodes: 1
  log_every_n_steps: 10
  val_check_interval: 200
  num_sanity_val_steps: 0
  fast_dev_run: false
  matmul_precision: "high"
  accumulate_grad_batches: 1

  checkpoint:
    save_top_k: 2
    save_weights_only: true
    val_checkpoint_interval: 200
    train_checkpoint_interval: 100

decoding:
  beam_width: 0
  mode: "spec_greedy"
  spec:
    max_draft: 2
    per_token_blank: 4

debug: false
seed: 42
