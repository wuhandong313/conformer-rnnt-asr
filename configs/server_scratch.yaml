# ===========================================================================
# Conformer-RNNT ASR — 服务器配置: Medusa 1 头, 从头训练 (共享 w_vocab 架构)
# ===========================================================================
#
# 用法:
#   python train.py configs/server_scratch.yaml
#
# 相对 server.yaml 的差异:
#   - paths.from_checkpoint: val-none ckpt → null   (从头训练, 不加载 base)
#   - medusa.num_heads: 2 → 1                        (只预测 y_{u+1}, 对比多头)
#   - medusa.freeze_base: true → false               (base 与 Medusa heads 联合训练)
#   - paths.exp_dir: 独立 exp_scratch 目录            (避免 checkpoint 与
#     server.yaml 的 val-none 混在一起, eval.py 自动加载最新 val-*.ckpt 会串实验)
#
# 其余保持 server.yaml 一致 (naive 压缩, hop_length 160, A100 调参)。
#
# 架构说明: 本配置基于已修复的共享投影架构 —— Medusa heads 的 w_vocab 与
# joiner.linear 是同一个 tensor (head 0 ≡ joiner 精确一致)。从头联合训练
# 用于验证共享投影对 draft 接受率的影响 (对比 server.yaml 的冻结重训)。
#
# ===========================================================================

# ---------------------------------------------------------------------------
# 路径配置 — 数据集、模型文件、输出目录
# ---------------------------------------------------------------------------
paths:
  # LibriSpeech 数据集根目录 (内含 LibriSpeech/ 子目录)
  dataset_path: "/test21/medusa"

  # SentencePiece BPE 模型文件路径 (文本 tokenize / detokenize)
  sp_model_path: "/test21/medusa/spm_bpe_74.model"

  # 全局特征统计文件路径 (JSON: mean + invstddev)
  global_stats_path: "/test21/medusa/global_stats.json"

  # 实验输出目录 (独立于 server.yaml, 避免旧 checkpoint 混入)
  exp_dir: "/test21/conformer-rnnt-asr/exp_scratch"

  # 从头训练 (null = 不加载任何 checkpoint)
  from_checkpoint: null

# ---------------------------------------------------------------------------
# 模型架构参数
# ---------------------------------------------------------------------------
model:
  # === 输入 / 输出 ===
  input_dim: 80
  encoding_dim: 512
  num_symbols: 74

  # === 时间降采样 ===
  time_reduction_input_dim: 128
  time_reduction_stride: 4
  right_context_length: 4

  # === Conformer 编码器 ===
  num_heads: 8
  ffn_dim: 1024
  num_layers_block1: 2
  num_layers_block2: 8
  depthwise_conv_kernel_size: 31
  dropout: 0.1

  # === 层间动态压缩 ===
  compression:
    # 与 server.yaml 保持一致 (naive): 只动 Medusa 配置
    filter: "naive"
    hanning_window_size: 5
    weight_predictor_mode: "diff5"

  # === Predictor (RNN-T 语言模型组件) ===
  predictor:
    symbol_embedding_dim: 128
    num_lstm_layers: 2
    lstm_hidden_dim: 128
    lstm_layer_norm: true
    lstm_layer_norm_epsilon: 0.001
    lstm_dropout: 0.3

  # === Medusa 多头未来标签预测 (1 头 + 不冻结, 从头联合训练) ===
  medusa:
    # 头数 K (head 1..K 做 aux CE); 0 = 关闭. 这里 1 = 仅 head1 预测 y_{u+1}
    num_heads: 1
    input_mode: "stream_local"
    lookahead_frames: 1
    draft_after_emit: true
    accept_ce_weight: 1.0

    # base model (encoder/predictor/joiner) 与 Medusa heads 联合从头训练
    freeze_base: false

    # 各 head 的 shifted-CE 权重 λ_k=0.8^k (num_heads=1 时只取前 1 个)
    ce_loss_weights: [0.8, 0.64, 0.512, 0.4096]

    # KL-to-base 权重 β (防 draft 漂移)
    kl_weight: 0.05

  # === Joiner (联合网络, 融合声学+语言编码) ===
  joiner:
    activation: "relu"

# ---------------------------------------------------------------------------
# 训练超参数
# ---------------------------------------------------------------------------
training:
  learning_rate: 0.0005
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  warmup_steps: 10000
  rnnt_loss_reduction: "mean"
  rnnt_loss_clamp: 1.0
  gradient_clip_val: 10.0
  epochs: 120

# ---------------------------------------------------------------------------
# 数据配置
# ---------------------------------------------------------------------------
data:
  sample_rate: 16000
  n_fft: 400
  n_mels: 80
  hop_length: 160

  spec_augment:
    freq_mask_param: 27
    time_mask_param: 100
    time_mask_prob: 0.2

  max_token_limit: 4000
  num_workers: 20
  prefetch_factor: 2

  train_subset: "train-clean-100"
  val_subset: "dev-clean"
  test_subset: "test-clean"

# ---------------------------------------------------------------------------
# PyTorch Lightning Trainer 配置
# ---------------------------------------------------------------------------
trainer:
  accelerator: "cuda"
  strategy: "auto"
  devices: 1
  num_nodes: 1

  log_every_n_steps: 10
  val_check_interval: 200
  num_sanity_val_steps: 0
  fast_dev_run: false
  matmul_precision: "high"
  accumulate_grad_batches: 1

  checkpoint:
    save_top_k: 2
    save_weights_only: true
    val_checkpoint_interval: 200
    train_checkpoint_interval: 100

# ---------------------------------------------------------------------------
# 解码配置 (eval 时生效)
# ---------------------------------------------------------------------------
decoding:
  # width-1 greedy = 无损投机解码的 oracle 基线
  beam_width: 0

  # spec_greedy: beam 解码结果不变 + Medusa draft 接受率统计
  mode: "spec_greedy"

  spec:
    max_draft: 4
    per_token_blank: 4

# ---------------------------------------------------------------------------
# 其他
# ---------------------------------------------------------------------------
debug: false
seed: 42
